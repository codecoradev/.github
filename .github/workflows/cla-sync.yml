name: CLA Sync

# Consumes [CLA] Signature issues created by the signing portal
# (https://codecoradev.github.io/cla/), validates them against the claimed
# GitHub identity, appends the signature to .cla/signatures.json, and opens
# an auto-generated PR for owner review.
#
# Why server-side: contributors authenticate to the portal with a
# non-push OAuth token, so the portal itself must not (and cannot) apply
# repo labels. Labeling and the signatures.json write both happen here,
# with a PAT that has write access to this repository.

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: write
  pull-requests: write

concurrency:
  group: cla-sync-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'cla-signature') || startsWith(github.event.issue.title, '[CLA] Signature:')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # NOTE: step state is passed via /tmp/cla-state.env (persists across
      # steps on the same runner) — NOT via step outputs, which silently
      # failed to propagate on this workflow (live-tested 2026-09-10).

      - name: Validate & apply signature
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const issue = context.payload.issue;
            const author = issue.user.login;
            const body = issue.body || '';
            console.log(`issue #${'$'}{issue.number} by @${'$'}{author}, body length ${'$'}{body.length}`);

            let result = 'error', reason = 'unhandled', username = author;
            try {
              const field = (label) => {
                const m = body.match(new RegExp(`- \\*\\*${'$'}{label}:\\*\\* (.+)`));
                return m ? m[1].trim() : null;
              };
              const name = field('Name');
              const claimedUser = (field('GitHub') || '').replace(/^@/, '');
              const claType = field('CLA Type');
              const signature = field('Signature');
              console.log(`parsed: name=${'$'}{JSON.stringify(name)} claimed=${'$'}{JSON.stringify(claimedUser)} type=${'$'}{JSON.stringify(claType)} sig=${'$'}{JSON.stringify(signature)}`);

              if (!name || !claimedUser || !claType || !signature) {
                result = 'invalid';
                reason = 'Missing required fields (Name / GitHub / CLA Type / Signature).';
              } else if (author.toLowerCase() !== claimedUser.toLowerCase()) {
                // Identity binding: the issue opener must be the claimed user
                // (portal fills the username via OAuth — this guards against
                // hand-crafted issues signing for someone else).
                result = 'rejected';
                reason = `Issue opened by @${'$'}{author} but claims signature for @${'$'}{claimedUser}.`;
              } else if (!['individual', 'corporate'].includes(claType)) {
                result = 'invalid';
                reason = `Unknown CLA type: ${'$'}{claType}`;
              } else {
                // Merge into signatures.json (idempotent per username).
                const path = '.cla/signatures.json';
                const db = JSON.parse(fs.readFileSync(path, 'utf8'));
                db.signatures = (db.signatures || []).filter(
                  (s) => s.github_username.toLowerCase() !== author.toLowerCase()
                );
                db.signatures.push({
                  name,
                  github_username: author,
                  signed_at: new Date().toISOString(),
                  cla_type: claType,
                  commit_sha: context.sha.slice(0, 7),
                  signature,
                });
                fs.writeFileSync(path, JSON.stringify(db, null, 2) + '\n');
                result = 'ok';
                reason = 'signature applied';
              }
            } catch (e) {
              result = 'error';
              reason = `exception: ${'$'}{e}`;
              console.error(e);
            }

            fs.writeFileSync('/tmp/cla-state.env',
              `RESULT=${'$'}{result}\nREASON=${'$'}{reason.replace(/\n/g, ' ')}\nUSERNAME=${'$'}{username}\nPR_URL=\n`);
            console.log(`state: result=${'$'}{result} reason=${'$'}{reason}`);

      - name: Label issue (server-side)
        run: |
          source /tmp/cla-state.env
          if [ "$RESULT" != "ok" ]; then echo "skip: RESULT=$RESULT"; exit 0; fi
          gh issue edit ${{ github.event.issue.number }} --add-label cla-signature --repo codecoradev/.github
        env:
          GH_TOKEN: ${{ secrets.OWNER_PAT }}

      - name: Create signature PR
        run: |
          source /tmp/cla-state.env
          if [ "$RESULT" != "ok" ]; then echo "skip: RESULT=$RESULT"; exit 0; fi
          BRANCH="cla/signature-$USERNAME"
          git config user.name "cla-sync[bot]"
          git config user.email "cla-sync[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add .cla/signatures.json
          git commit -m "cla: add signature for @$USERNAME (issue #${{ github.event.issue.number }})"
          # Org caps GITHUB_TOKEN at read — push with the PAT explicitly.
          git push "https://x-access-token:${GH_TOKEN}@github.com/codecoradev/.github.git" "$BRANCH"
          PR_URL=$(gh pr create \
            --repo codecoradev/.github \
            --head "$BRANCH" \
            --base main \
            --title "cla: add signature for @$USERNAME" \
            --body "## What
          - Adds CLA signature for @$USERNAME to \`.cla/signatures.json\`
          - Source: signing portal issue #${{ github.event.issue.number }} (identity verified: issue opener == claimed GitHub user)

          ## Why
          - Automates the manual signature-recording step; the \`cla-check\` workflow in product repos reads this file.

          ## Testing
          - \`cla-sync\` validation passed (fields parsed, identity match, CLA type known)
          - Owner merges this PR to complete the CLA flow") || PR_URL=""
          # Persist PR_URL for the comment/close steps.
          sed -i "s|^PR_URL=.*|PR_URL=${PR_URL}|" /tmp/cla-state.env
          echo "pr_url=$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.OWNER_PAT }}

      - name: Comment result on issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const state = Object.fromEntries(
              fs.readFileSync('/tmp/cla-state.env', 'utf8').trim().split('\n').map((l) => {
                const i = l.indexOf('=');
                return [l.slice(0, i), l.slice(i + 1)];
              })
            );
            console.log(`state file: ${'$'}{JSON.stringify(state)}`);
            let msg;
            if (state.RESULT === 'ok' && state.PR_URL) {
              msg = `✅ Signature validated and recorded.\n\n📎 Review & merge: ${'$'}{state.PR_URL}\nOnce merged, the \`cla-check\` workflow will pass for your PRs. No further action needed.`;
            } else if (state.RESULT === 'ok') {
              msg = `✅ Signature validated, but the automated PR could not be created — a signature PR for your account is probably already pending. A maintainer will finalize it shortly.`;
            } else {
              msg = `⚠️ Could not process this signature automatically: ${'$'}{state.REASON}\n\nPlease re-submit via https://codecoradev.github.io/cla/ (make sure you sign in with GitHub first), or contact a maintainer.`;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: msg,
            });

      - name: Close processed issue
        run: |
          source /tmp/cla-state.env
          if [ "$RESULT" = "ok" ] && [ -n "$PR_URL" ]; then
            gh issue close ${{ github.event.issue.number }} --repo codecoradev/.github --reason completed
          else
            echo "skip: RESULT=$RESULT PR_URL=$PR_URL"
          fi
        env:
          GH_TOKEN: ${{ secrets.OWNER_PAT }}
